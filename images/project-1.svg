<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1F24"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A4F"/>
      <stop offset="100%" stop-color="#E7473C"/>
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E7473C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background window -->
  <rect width="600" height="360" rx="16" fill="url(#p1Grad)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#18181B"/>
  <rect x="0" y="24" width="600" height="18" fill="#18181B"/>
  <circle cx="28" cy="21" r="5.5" fill="#E7473C"/>
  <circle cx="48" cy="21" r="5.5" fill="#E5B942"/>
  <circle cx="68" cy="21" r="5.5" fill="#38C172"/>
  <rect x="180" y="10" width="240" height="22" rx="6" fill="#24262E"/>
  <text x="300" y="25" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#A0A5B5" text-anchor="middle">flexbox-playground.css</text>

  <!-- Split View: Sidebar Controls -->
  <rect x="24" y="60" width="160" height="275" rx="10" fill="#1E2027" stroke="#2D303B" stroke-width="1.5"/>
  <text x="38" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">LAYOUT CONTROLS</text>
  
  <rect x="38" y="102" width="132" height="26" rx="6" fill="#E7473C"/>
  <text x="104" y="119" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">justify: space-between</text>

  <rect x="38" y="136" width="132" height="26" rx="6" fill="#262933"/>
  <text x="104" y="153" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" fill="#CBD0DF" text-anchor="middle">align-items: center</text>

  <rect x="38" y="170" width="132" height="26" rx="6" fill="#262933"/>
  <text x="104" y="187" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" fill="#CBD0DF" text-anchor="middle">flex-wrap: wrap</text>

  <rect x="38" y="204" width="132" height="26" rx="6" fill="#262933"/>
  <text x="104" y="221" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" fill="#CBD0DF" text-anchor="middle">gap: 24px</text>

  <!-- Interactive Flex Canvas -->
  <rect x="200" y="60" width="375" height="275" rx="10" fill="#15161A" stroke="#2D303B" stroke-width="1.5"/>
  
  <!-- Flex Container Guide Lines -->
  <rect x="216" y="80" width="343" height="235" rx="8" fill="none" stroke="#E7473C" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <text x="228" y="100" font-family="monospace" font-size="10" fill="#E7473C">display: flex;</text>

  <!-- Flex Items -->
  <g filter="url(#p1Glow)">
    <rect x="230" y="125" width="95" height="150" rx="10" fill="#E7473C"/>
    <text x="277" y="195" font-family="sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="277" y="220" font-family="monospace" font-size="10" fill="#FFE0DD" text-anchor="middle">flex: 1</text>
  </g>

  <rect x="340" y="125" width="95" height="150" rx="10" fill="#2A2D38" stroke="#3E4251" stroke-width="1.5"/>
  <text x="387" y="195" font-family="sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="387" y="220" font-family="monospace" font-size="10" fill="#A0A5B5" text-anchor="middle">flex: 1</text>

  <rect x="450" y="125" width="95" height="150" rx="10" fill="#2A2D38" stroke="#3E4251" stroke-width="1.5"/>
  <text x="497" y="195" font-family="sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">03</text>
  <text x="497" y="220" font-family="monospace" font-size="10" fill="#A0A5B5" text-anchor="middle">flex: 1</text>
</svg>
